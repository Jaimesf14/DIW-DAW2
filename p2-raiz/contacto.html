<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contacto · RAÍZ</title>
    <link rel="stylesheet" href="/src/tailwind.css" />
  </head>
  <!-- Pongo esto en el body para que el footer no quede en mitad de la página -->
  <body class="min-h-screen flex flex-col">
    <!-- ✍️ B3 · Esta página va SOLO con Tailwind (src/tailwind.css), sin SASS. Ponle las clases de utilidad:
         los colores de RAÍZ (del @theme), dos columnas desde md y un botón con hover: y focus-visible:.
         Nada de valores sueltos entre corchetes ni style="". -->
    <header class="bg-marca text-white p-4 flex justify-between items-center">
      <a href="/" class="font-bold">RAÍZ</a>
      <nav class="flex gap-4" aria-label="Principal">
        <a href="/">Inicio</a>
        <a href="/producto.html">Monstera</a>
        <a href="/contacto.html" aria-current="page">Contacto</a>
      </nav>
    </header>

    <!-- Pongo flex-1 en el body para que el main no quede en mitad de la página, ya que hace que el main ocupe todo el espacio en blanco -->
    <main class="flex-1">
      <h1 class="p-4 text-xl font-bold text-tierra border-b-3 border-marca">Contacto</h1>

      <!-- para crear dos columnas desde el tamaño md pongo md:flex-row -->
      <div class="flex flex-col md:flex-row md:gap-4 md:grid-cols-2 pt-4">
        <section class="p-4 md:w-1/2">
          <h2 class="font-bold text-marca">El vivero</h2>
          <p class="pt-2 pb-2">
            Abrimos de lunes a sábado, de 9:00 a 14:00. Si vienes en persona, te ayudamos a elegir.
          </p>
          <p>Envíos gratis desde 40 €</p>
        </section>

        <form class="p-4 gap-4 flex flex-col mx-4 p-4 bg-fondo rounded-lg md:w-1/2 grid-cols-1 md:grid-cols-2">
          <div class="flex flex-col md:flex-row md:gap-4 md:grid-cols-2">
            <label class="md:col-span-1">
              Nombre:
              <!-- para que el boton cambie de color al seleccionarlo, como especifica el enunciado , pongo focus-visible:ring-tierra.
              Tambien he puesto w-full, que es para que el input ocupe todo el anchjo de la pagina -->
              <input
                class="border-2 border-marca rounded-md w-full focus-visible:ring-tierra"
                id="nombre"
                name="nombre"
                autocomplete="name"
                required
              />
            </label>
            <label>
              Correo:
              <input
                class="border-2 border-marca rounded-md w-full focus-visible:ring-tierra"
                id="correo"
                name="correo"
                type="email"
                autocomplete="email"
                required
              />
            </label>
          </div>

          <label>
            ¿En qué te ayudamos?
            <textarea
              class="border-2 border-marca rounded-md resize-y w-full focus-visible:ring-tierra"
              id="mensaje"
              name="mensaje"
              rows="4"
              required
            ></textarea>
          </label>
          <!-- para que el boton cambie de color al pasar el rraton por encima, como especifica el enunciado , pongo hover:bg-marca-oscuro -->
          <button
            class="md:cold-span-2 p-4 border border-2 border-marca rounded-md bg-marca font-bold text-white hover:bg-marca-oscuro focus-visible:ring-tierra"
            type="submit"
          >
            Enviar
          </button>
        </form>
      </div>
    </main>

    <footer class="bg-marca-oscuro text-white text-center p-4">RAÍZ, vivero online · Cádiz</footer>
  </body>
</html>
